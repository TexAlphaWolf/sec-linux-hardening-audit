name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov

  evaluation:
    name: measured quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: Every rule fails when broken on purpose, every fix works
        run: |
          python tools/evaluate.py | tee eval.txt
          tail -n 1 eval.txt | grep -qx OK
      - name: Our reading of sshd_config against the real sshd -T
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q openssh-server
          sudo env "PATH=$PATH" python tools/crosscheck_sshd.py 500 1 | tee ssh.json
          python -c "import json; d=json.load(open('ssh.json')); assert d['mismatches']==0 and d['values_compared']>=5000, d"

  real-systems:
    # The same script on real distributions: audit, fix --apply, undo, then prove /etc is
    # byte-identical to how it started. Containers share the host kernel and mount /proc/sys
    # read-only, so kernel settings cannot be changed there: the fix then writes the sysctl file
    # and reports a warning, which is also behaviour worth testing.
    name: real system (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            prepare: apt-get update -q >/dev/null 2>&1 && apt-get install -y -q python3
            python: python3
          - image: debian:13
            prepare: apt-get update -q >/dev/null 2>&1 && apt-get install -y -q python3
            python: python3
          - image: ubuntu:24.04
            prepare: apt-get update -q >/dev/null 2>&1 && apt-get install -y -q python3
            python: python3
          - image: rockylinux:9
            prepare: dnf install -y -q python3.11
            python: python3.11
          - image: almalinux:9
            prepare: dnf install -y -q python3.11
            python: python3.11
    steps:
      - uses: actions/checkout@v7
      - name: Round trip inside the container
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/src:ro" ${{ matrix.image }} \
            sh -c '${{ matrix.prepare }} >/dev/null && ${{ matrix.python }} -I /src/tools/system_check.py' | tee result.json
          python3 - <<'PY'
          import json
          d = json.loads(open("result.json").read().strip().splitlines()[-1])  # the last line is the JSON
          assert d["errors"] == [], d["errors"]
          assert d["etc_differences_after_undo"] == [], d["etc_differences_after_undo"]
          assert d["counts"]["pass"] + d["counts"]["fail"] >= 25, d["counts"]
          print("ok:", d["distro"], d["family"], d["score_before"], "->", d["score_after_fix"])
          PY

  image-audit:
    # Offline mode: export the file system of a real distribution and audit the directory.
    name: exported image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "debian:12", family: debian}
          - {image: "ubuntu:24.04", family: debian}
          - {image: "rockylinux:9", family: rhel}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: sudo apt-get update -q && sudo apt-get install -y -q rpm
      - name: Audit the exported tree
        run: |
          mkdir tree
          docker export "$(docker create ${{ matrix.image }})" | sudo tar -x -C tree
          set +e
          sudo env "PATH=$PATH" hardaudit audit --root tree --format json > report.json
          code=$?
          set -e
          [ "$code" -le 1 ]
          python - <<'PY'
          import json
          d = json.load(open("report.json"))
          assert d["family"] == "${{ matrix.family }}", d["family"]
          assert d["counts"]["error"] == 0, d["counts"]
          judged = d["counts"]["pass"] + d["counts"]["fail"]
          assert judged >= 15, d["counts"]
          print(d["distro"], "score", d["score"], d["counts"])
          PY

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t hardaudit .
      - name: Audit a mounted tree, read-only, no capabilities
        run: |
          mkdir tree
          docker export "$(docker create debian:12)" | sudo tar -x -C tree
          set +e
          docker run --rm --read-only --cap-drop ALL -v "$PWD/tree:/host:ro" hardaudit audit --root /host | tee out.txt
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -le 1 ]
          grep -q "^hardaudit " out.txt
          grep -q "debian family" out.txt
