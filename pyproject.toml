[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardaudit"
version = "1.0.0"
description = "Audits a Linux host against a set of hardening rules (Debian/Ubuntu and RHEL family), scores it, and can apply the safe fixes with backup and undo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Standard library only at run time; the rules are TOML files read with tomllib.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
  "playwright>=1.45",  # only to render the README screenshot
]

[project.scripts]
hardaudit = "hardaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardaudit = ["rules/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["hardaudit"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]
"tests/*" = ["E501"]
"tools/*" = ["E501", "E402"]  # they put src/ on sys.path before importing
