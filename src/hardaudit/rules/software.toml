# Installed software. Package names differ between families, so each rule lists both.

[[rule]]
id = "HA-PKG-001"
title = "No telnet client or server is installed"
section = "Software"
severity = "high"
why = "Telnet sends passwords in clear text."
fix = "Remove the packages listed (apt remove / dnf remove) and use SSH."
check = { type = "package", absent = { debian = ["telnet", "telnetd", "inetutils-telnet", "inetutils-telnetd"], rhel = ["telnet", "telnet-server"] } }

[[rule]]
id = "HA-PKG-002"
title = "No rsh or rlogin software is installed"
section = "Software"
severity = "high"
why = "The r-commands trust the network and send data unencrypted."
fix = "Remove the packages listed and use SSH."
check = { type = "package", absent = { debian = ["rsh-client", "rsh-server", "rsh-redone-client", "rsh-redone-server"], rhel = ["rsh", "rsh-server"] } }

[[rule]]
id = "HA-PKG-003"
title = "No NIS software is installed"
section = "Software"
severity = "medium"
why = "NIS is an old directory service with weak protection of account data."
fix = "Remove the packages listed; use LDAP or local accounts."
check = { type = "package", absent = { debian = ["nis"], rhel = ["ypbind", "ypserv"] } }

[[rule]]
id = "HA-PKG-004"
title = "No TFTP server is installed"
section = "Software"
severity = "medium"
why = "TFTP has no authentication."
fix = "Remove the packages listed unless this host is a deliberate PXE/TFTP server."
check = { type = "package", absent = { debian = ["tftpd", "tftpd-hpa", "atftpd"], rhel = ["tftp-server"] } }

[[rule]]
id = "HA-PKG-005"
title = "Avahi (mDNS) is not installed"
section = "Software"
severity = "low"
why = "Announcing the machine and its services to the local network is not wanted on a server."
fix = "Remove avahi-daemon (apt remove avahi-daemon / dnf remove avahi)."
check = { type = "package", absent = { debian = ["avahi-daemon"], rhel = ["avahi"] } }

[[rule]]
id = "HA-PKG-006"
title = "A host firewall is installed"
section = "Software"
severity = "medium"
why = "A firewall limits what the network can reach even when a service starts by mistake. This rule checks that one is installed, not how it is configured."
fix = "Install and configure ufw or nftables (Debian family), firewalld or nftables (RHEL family)."
check = { type = "package", present = { debian = ["ufw", "nftables", "firewalld"], rhel = ["firewalld", "nftables"] } }

[[rule]]
id = "HA-PKG-007"
title = "A file-integrity tool (AIDE) is installed"
section = "Software"
severity = "low"
why = "Without a baseline you cannot tell whether system files were changed."
fix = "Install aide and create a baseline (aideinit / aide --init)."
check = { type = "package", present = { debian = ["aide"], rhel = ["aide"] } }
